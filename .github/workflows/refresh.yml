name: Refresh News Dashboard

on:
  schedule:
    - cron: '0 4,12,18 * * *'  # 4am, noon, 6pm UTC = 7am, 3pm, 9pm Bucharest (summer)
  workflow_dispatch:             # allow manual trigger from GitHub UI

permissions:
  contents: write

# One refresh at a time, so two runs never restore the same article DB
# snapshot and overwrite each other's additions.
concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser anthropic

      # Carry the article DB between runs so already-translated articles are
      # not re-fetched into an empty DB and re-translated every run. Cache keys
      # are immutable, so each run saves under its own key and restores the
      # newest one by prefix.
      - name: Restore article database
        uses: actions/cache/restore@v6
        with:
          path: Source/articles.db
          key: articles-db-${{ github.run_id }}
          restore-keys: articles-db-

      - name: Build dashboard
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python Source/run.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 3 = dashboard built fine but the AI briefing failed. Let the
          # deploy proceed so today's articles still ship, then fail the run
          # in the final step. Any other non-zero code is fatal here.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Save article database
        uses: actions/cache/save@v6
        with:
          path: Source/articles.db
          key: articles-db-${{ github.run_id }}

      - name: Prepare index.html for Pages
        run: cp Output/dashboard.html Output/index.html


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Output
          publish_branch: gh-pages
          commit_message: 'chore: refresh dashboard [run ${{ github.run_number }}]'

      - name: Fail if the AI briefing is missing
        if: steps.build.outputs.exit_code == '3'
        run: |
          echo "::error title=AI briefing missing::Dashboard deployed, but the AI briefing failed to generate. Check the ANTHROPIC_API_KEY secret and the account's credit balance."
          exit 1
